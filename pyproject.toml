[project]
name = "bloop"
version = "0.1.0"
description = "Soundpad-style board with a native virtual audio cable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
bloop = "bloop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
